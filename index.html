<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#073b4c">

<title>Ignite Living | Flexible Furnished Living</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#073b4c;
  --navy2:#0b5268;
  --teal:#0d8795;
  --teal-dark:#086d79;
  --cream:#f6f7f5;
  --gold:#f5b82e;
  --green:#168552;
  --text:#18282d;
  --muted:#66767c;
  --line:#dfe6e8;
  --white:#fff;
  --shadow:0 15px 45px rgba(10,45,55,.13);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:"DM Sans",sans-serif;
  color:var(--text);
  background:#fff;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}


/* =========================================================
   HEADER
========================================================= */

header{
  background:var(--navy);
  color:white;
}

.nav{
  max-width:1260px;
  margin:auto;
  padding:17px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:700;
  letter-spacing:.8px;
  font-size:21px;
}

.brand-mark{
  width:38px;
  height:38px;
  border:2px solid white;
  border-radius:50% 50% 50% 10%;
  display:grid;
  place-items:center;
  transform:rotate(-12deg);
}

.brand-mark span{
  transform:rotate(12deg);
  font-family:"Playfair Display",serif;
}

.nav-right{
  display:flex;
  gap:25px;
  align-items:center;
  font-size:14px;
}

.nav-right a{
  color:white;
  text-decoration:none;
}

.manage-link{
  border:1px solid rgba(255,255,255,.55);
  border-radius:7px;
  padding:10px 16px;
}


/* =========================================================
   SEARCH HERO
========================================================= */

.search-hero{
  background:
    radial-gradient(circle at 85% 0%,rgba(28,168,177,.32),transparent 30%),
    linear-gradient(125deg,#073b4c 0%,#07566a 100%);
  color:white;
  padding:42px 24px 76px;
}

.hero-inner{
  max-width:1260px;
  margin:auto;
}

.hero-label{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  opacity:.76;
  margin-bottom:10px;
}

.hero-inner h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(36px,5vw,57px);
  line-height:1.05;
  margin:0;
  max-width:740px;
}

.hero-inner p{
  margin:14px 0 0;
  color:#d7e8eb;
  max-width:670px;
  font-size:17px;
  line-height:1.6;
}


/* =========================================================
   SEARCH BAR
========================================================= */

.search-container{
  max-width:1260px;
  margin:-38px auto 0;
  padding:0 24px;
  position:relative;
  z-index:5;
}

.searchbar{
  background:white;
  border:4px solid var(--gold);
  border-radius:10px;
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr .85fr auto;
  box-shadow:0 14px 40px rgba(0,0,0,.18);
  overflow:hidden;
}

.search-field{
  padding:12px 16px;
  border-right:1px solid var(--line);
  background:white;
}

.search-field label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.9px;
  font-weight:700;
  color:#718087;
  margin-bottom:5px;
}

.search-field input,
.search-field select{
  border:0;
  outline:0;
  width:100%;
  background:white;
  color:var(--text);
}

.search-button{
  border:0;
  padding:0 29px;
  background:var(--teal);
  color:white;
  font-weight:700;
  min-height:61px;
}

.search-button:hover{
  background:var(--teal-dark);
}


/* =========================================================
   MAIN
========================================================= */

main{
  max-width:1260px;
  margin:auto;
  padding:60px 24px 90px;
}

.intro-row{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
  gap:20px;
}

.intro-row h2{
  font-family:"Playfair Display",serif;
  font-size:34px;
  margin:0 0 6px;
}

.intro-row p{
  margin:0;
  color:var(--muted);
}

.result-count{
  font-size:14px;
  color:var(--muted);
}


/* =========================================================
   PROPERTY LIST
========================================================= */

.property-list{
  display:flex;
  flex-direction:column;
  gap:24px;
}

.property{
  display:grid;
  grid-template-columns:390px 1fr;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:white;
  min-height:280px;
  transition:.2s ease;
}

.property:hover{
  box-shadow:var(--shadow);
  transform:translateY(-2px);
}

.property.hidden{
  display:none;
}

.property-image{
  position:relative;
  min-height:280px;
  background:#e5e9ea;
  overflow:hidden;
}

.property-image img{
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  object-fit:cover;
  transition:transform .5s ease;
}

.property:hover .property-image img{
  transform:scale(1.035);
}

.status-badge{
  position:absolute;
  top:14px;
  left:14px;
  z-index:2;
  background:white;
  color:#19343d;
  padding:7px 11px;
  border-radius:5px;
  font-size:11px;
  font-weight:700;
  box-shadow:0 4px 15px rgba(0,0,0,.14);
}

.status-badge.soon{
  background:#26363b;
  color:white;
}

.property-content{
  padding:24px 27px;
  display:flex;
  flex-direction:column;
}

.location{
  color:var(--teal);
  font-size:12px;
  font-weight:700;
  letter-spacing:.4px;
  margin-bottom:6px;
}

.property-title{
  font-family:"Playfair Display",serif;
  font-size:28px;
  margin:0 0 5px;
}

.property-type{
  color:var(--muted);
  font-size:14px;
}

.rating{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  font-size:13px;
}

.rating-number{
  background:var(--navy);
  color:white;
  font-weight:700;
  padding:5px 7px;
  border-radius:5px 5px 5px 0;
}

.rating-muted{
  color:#7b898e;
}

.features{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:17px 0;
}

.feature{
  font-size:12px;
  padding:6px 9px;
  background:#f2f5f5;
  border-radius:4px;
}

.property-footer{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:25px;
  margin-top:auto;
}

.availability{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}

.availability strong{
  color:var(--green);
}

.price-area{
  text-align:right;
  min-width:160px;
}

.price-label{
  color:var(--muted);
  font-size:11px;
}

.price{
  font-size:24px;
  font-weight:700;
  margin-top:2px;
}

.price-note{
  font-size:11px;
  color:var(--muted);
}

.property-button{
  margin-top:9px;
  background:var(--teal);
  color:white;
  border:0;
  border-radius:6px;
  padding:11px 17px;
  font-weight:700;
}

.property-button:hover{
  background:var(--teal-dark);
}

.property-button:disabled{
  background:#d6dddf;
  color:#77858a;
  cursor:not-allowed;
}


/* =========================================================
   COLLECTION SECTION
========================================================= */

.collection{
  margin-top:65px;
  border-top:1px solid var(--line);
  padding-top:45px;
}

.collection h2{
  font-family:"Playfair Display";
  font-size:32px;
  margin:0 0 8px;
}

.collection > p{
  color:var(--muted);
  max-width:700px;
  line-height:1.6;
}

.benefits{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
}

.benefit{
  background:white;
  padding:27px;
}

.benefit-icon{
  font-size:25px;
  margin-bottom:13px;
}

.benefit strong{
  display:block;
  margin-bottom:6px;
}

.benefit span{
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  background:#052f3d;
  color:white;
  padding:44px 24px;
}

.footer-inner{
  max-width:1260px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:30px;
}

.footer-title{
  font-weight:700;
  letter-spacing:.7px;
}

.footer-text{
  color:#abc2c8;
  font-size:13px;
  max-width:520px;
  line-height:1.6;
  margin-top:8px;
}


/* =========================================================
   PROPERTY MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  background:white;
  width:min(960px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:12px;
  position:relative;
}

.modal-close{
  position:absolute;
  z-index:20;
  top:14px;
  right:14px;
  border:0;
  width:40px;
  height:40px;
  border-radius:50%;
  background:white;
  box-shadow:0 3px 14px rgba(0,0,0,.22);
  font-size:21px;
}

.gallery{
  height:370px;
  display:grid;
  grid-template-columns:1.7fr 1fr;
  gap:3px;
  background:#ddd;
}

.gallery-main,
.gallery-side{
  overflow:hidden;
  position:relative;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery-side{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:3px;
}

.gallery-placeholder{
  background:
    linear-gradient(135deg,rgba(7,59,76,.85),rgba(13,135,149,.65));
  color:white;
  display:grid;
  place-items:center;
  text-align:center;
  padding:25px;
}

.modal-body{
  padding:28px 30px 34px;
}

.modal-location{
  color:var(--teal);
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.modal-title{
  font-family:"Playfair Display";
  font-size:33px;
  margin:0;
}

.modal-description{
  color:var(--muted);
  line-height:1.65;
  max-width:760px;
  margin-top:12px;
}

.modal-features{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0;
}

.modal-feature{
  border:1px solid var(--line);
  padding:8px 11px;
  border-radius:5px;
  font-size:13px;
}


/* =========================================================
   RENTAL PANEL
========================================================= */

.rental-panel{
  margin-top:28px;
  border-top:1px solid var(--line);
  padding-top:25px;
}

.rental-panel h3{
  margin:0 0 17px;
  font-size:21px;
}

.rental-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:11px;
}

.rental-input{
  border:1px solid var(--line);
  padding:11px 12px;
  border-radius:6px;
}

.rental-input label{
  display:block;
  color:var(--muted);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.7px;
  font-weight:700;
  margin-bottom:5px;
}

.rental-input input,
.rental-input select{
  border:0;
  outline:0;
  width:100%;
  background:white;
}

.rental-summary{
  background:#f5f8f8;
  margin-top:15px;
  padding:16px;
  display:none;
  border-radius:6px;
}

.rental-summary.visible{
  display:block;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:4px 0;
  font-size:14px;
}

.summary-row.total{
  border-top:1px solid #dbe2e3;
  margin-top:8px;
  padding-top:11px;
  font-weight:700;
  font-size:16px;
}

.check-button{
  width:100%;
  border:0;
  background:var(--teal);
  color:white;
  padding:14px;
  border-radius:6px;
  margin-top:13px;
  font-weight:700;
}


/* =========================================================
   BOOKING STEP
========================================================= */

.booking-step{
  display:none;
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:22px;
}

.booking-step.visible{
  display:block;
}

.guest-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.guest-field{
  border:1px solid var(--line);
  border-radius:6px;
  padding:11px 12px;
}

.guest-field.full{
  grid-column:1/-1;
}

.guest-field label{
  display:block;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  font-weight:700;
  letter-spacing:.7px;
  margin-bottom:5px;
}

.guest-field input{
  width:100%;
  border:0;
  outline:0;
}

.terms-box{
  margin-top:17px;
  background:#f6f8f8;
  border:1px solid var(--line);
  padding:15px;
  font-size:13px;
  line-height:1.55;
}

.terms-box label{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.terms-box input{
  margin-top:3px;
}

.terms-link{
  color:var(--teal);
  font-weight:700;
  text-decoration:none;
}

.continue-button{
  width:100%;
  border:0;
  background:var(--navy);
  color:white;
  padding:14px;
  margin-top:14px;
  border-radius:6px;
  font-weight:700;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#17282d;
  color:white;
  padding:12px 18px;
  border-radius:7px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:2000;
  font-size:14px;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

  .searchbar{
    grid-template-columns:1fr 1fr;
  }

  .search-button{
    grid-column:1/-1;
  }

  .property
